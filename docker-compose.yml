services:
  db:
    image: mariadb:11.4
    container_name: bantaynet_mysql
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MYSQL_PASSWORD:-bantaynet_root_pw}
      MARIADB_DATABASE: ${MYSQL_DATABASE:-bantaynet_db}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: bantaynet_web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5000:5000"
    environment:
      HOST: 0.0.0.0
      PORT: 5000
      BANTAYNET_SECRET_KEY: ${BANTAYNET_SECRET_KEY:-change_this_secret_key_in_production}
      BANTAYNET_COOKIE_SECURE: ${BANTAYNET_COOKIE_SECURE:-0}
      BANTAYNET_SESSION_HOURS: ${BANTAYNET_SESSION_HOURS:-8}
      BANTAYNET_ADMIN_PASSWORD: ${BANTAYNET_ADMIN_PASSWORD:-?andMIN31241!}
      BANTAYNET_ANALYST_PASSWORD: ${BANTAYNET_ANALYST_PASSWORD:-!AnAlyzer3124!}
      BANTAYNET_VIEWER_PASSWORD: ${BANTAYNET_VIEWER_PASSWORD:-&vIEwer31514!}
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-bantaynet_root_pw}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-bantaynet_db}
    volumes:
      - ./evidence:/app/evidence
      - ./pcaps/uploads:/app/pcaps/uploads
      - ./rules:/app/rules

volumes:
  mysql_data:

